<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rack Finder</title>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f1f5f9;color:#111827}
.app{width:100%;max-width:620px;margin:auto;padding:14px}
.header{background:#111827;color:white;border-radius:20px;padding:20px 16px;text-align:center;margin-bottom:14px}
.header h1{margin:0;font-size:29px}.header p{margin:7px 0 0;color:#cbd5e1;font-weight:700}
.card{background:white;border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 4px 14px rgba(15,23,42,.08)}
.heading{text-align:center;font-size:19px;font-weight:900;margin-bottom:12px}
.input{width:100%;height:62px;border:3px solid #cbd5e1;border-radius:15px;padding:0 15px;font-size:19px;font-weight:700;outline:none}
.input:focus{border-color:#2563eb}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
button{border:0;border-radius:15px;min-height:58px;font-size:18px;font-weight:900;cursor:pointer}
.scan-btn{background:#111827;color:#fff}.search-btn{background:#2563eb;color:#fff}
.refresh-btn{background:#e2e8f0;color:#111827;width:100%;margin-top:10px}
.status-text{text-align:center;color:#64748b;font-size:13px;font-weight:700;margin-top:8px}
.result{display:none;border-radius:22px;padding:20px 14px;text-align:center}
.result.show{display:block}.result.found{background:#dcfce7;border:5px solid #16a34a}
.result.notfound{background:#fee2e2;border:5px solid #dc2626}
.result-title{font-size:25px;font-weight:900;margin-bottom:10px}
.result-model{font-size:22px;font-weight:900;word-break:break-word}
.rack-label{margin-top:16px;font-size:16px;font-weight:800;color:#475569}
.rack-code{margin-top:7px;font-size:52px;font-weight:1000;color:#15803d;line-height:1.05}
.rack-list{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:10px}
.rack-pill{background:#16a34a;color:#fff;border-radius:14px;padding:12px 18px;font-size:28px;font-weight:1000}
.not-found-text{font-size:21px;font-weight:900;color:#b91c1c}
.overlay{display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.82);padding:12px;align-items:center;justify-content:center}
.overlay.show{display:flex}
.camera-box{width:100%;max-width:600px;max-height:95vh;overflow:auto;background:white;border-radius:22px;padding:12px;text-align:center}
.camera-title{font-size:22px;font-weight:900;margin:4px 0 10px}
#reader{width:100%;overflow:hidden;border-radius:17px}
.camera-controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.control-btn{background:#e2e8f0;color:#111827}.control-btn.on{background:#f59e0b;color:#fff}
.control-btn:disabled{opacity:.5}
.close-btn{background:#dc2626;color:#fff;width:100%;margin-top:10px}
.zoom-wrap{margin-top:10px;text-align:left;font-weight:900}
#zoomSlider{width:100%;margin-top:8px}.zoom-value{text-align:center;margin-top:3px}
@media(max-width:430px){.rack-code{font-size:44px}.rack-pill{font-size:25px}}
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1>📍 RACK FINDER</h1>
    <p>Scan Product Code → Find Rack Column</p>
  </div>

  <div class="card">
    <div class="heading">PRODUCT CODE</div>

    <input id="productInput" class="input" type="text"
      autocomplete="off" autocorrect="off" autocapitalize="off"
      spellcheck="false" placeholder="Scan or type product code">

    <div class="row">
      <button type="button" class="scan-btn" id="scanButton">📷 SCAN CAMERA</button>
      <button type="button" class="search-btn" id="searchButton">🔎 SEARCH</button>
    </div>

    <button type="button" class="refresh-btn" id="refreshButton">↻ REFRESH SHEET DATA</button>
    <div id="statusText" class="status-text">Starting...</div>
  </div>

  <div id="resultBox" class="result">
    <div id="resultTitle" class="result-title"></div>
    <div id="resultModel" class="result-model"></div>
    <div class="rack-label">RACK COLUMN</div>
    <div id="rackResult"></div>
  </div>
</div>

<div id="cameraOverlay" class="overlay">
  <div class="camera-box">
    <div class="camera-title">📷 SCAN PRODUCT QR</div>
    <div id="reader"></div>

    <div class="zoom-wrap">
      🔍 CAMERA ZOOM
      <input id="zoomSlider" type="range" min="1" max="1" step="0.1" value="1">
      <div id="zoomValue" class="zoom-value">1.0×</div>
    </div>

    <div class="camera-controls">
      <button type="button" id="flashButton" class="control-btn">🔦 FLASH OFF</button>
      <button type="button" id="resetZoomButton" class="control-btn">↺ RESET ZOOM</button>
    </div>

    <button type="button" id="closeCameraButton" class="close-btn">CLOSE CAMERA</button>
  </div>
</div>

<script>
"use strict";

const API_URL = "https://script.google.com/macros/s/AKfycbwB_AWk6NrWUimxecJVpiM0RIFkDPK1RmWLLnGk61L2Unt-jlL_0qV9_xkK-ZOZZO1k/exec";

let sheetRows = [];
let qrScanner = null;
let cameraRunning = false;
let cameraOpening = false;
let cameraTrack = null;
let torchOn = false;
let lastCameraText = "";
let lastCameraTime = 0;
let zoomMinimum = 1;
let zoomMaximum = 1;
let zoomStep = 0.1;

const productInput = document.getElementById("productInput");
const statusText = document.getElementById("statusText");
const resultBox = document.getElementById("resultBox");
const resultTitle = document.getElementById("resultTitle");
const resultModel = document.getElementById("resultModel");
const rackResult = document.getElementById("rackResult");

const cameraOverlay = document.getElementById("cameraOverlay");
const zoomSlider = document.getElementById("zoomSlider");
const zoomValue = document.getElementById("zoomValue");
const flashButton = document.getElementById("flashButton");

document.getElementById("scanButton").addEventListener("click", openCamera);
document.getElementById("searchButton").addEventListener("click", searchProduct);
document.getElementById("refreshButton").addEventListener("click", loadData);
document.getElementById("flashButton").addEventListener("click", toggleFlash);
document.getElementById("resetZoomButton").addEventListener("click", resetZoom);
document.getElementById("closeCameraButton").addEventListener("click", closeCamera);
zoomSlider.addEventListener("input", function(){ applyZoom(this.value); });
productInput.addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    e.preventDefault();
    searchProduct();
  }
});

window.addEventListener("load", loadData);

function callApi(params, success, failure){
  const callbackName = "rackFinder_" + Date.now() + "_" + Math.floor(Math.random()*100000);
  const script = document.createElement("script");
  let finished = false;

  params.callback = callbackName;

  const query = Object.keys(params).map(function(key){
    return encodeURIComponent(key) + "=" + encodeURIComponent(params[key]);
  }).join("&");

  function cleanup(){
    if(finished) return;
    finished = true;
    clearTimeout(timer);
    script.remove();
    try{ delete window[callbackName]; }catch(e){}
  }

  const timer = setTimeout(function(){
    cleanup();
    if(failure) failure("Connection timeout.");
  },15000);

  window[callbackName] = function(data){
    cleanup();
    if(data && data.success === false){
      if(failure) failure(data.error || "Google Sheet returned an error.");
      return;
    }
    if(success) success(data || {});
  };

  script.onerror = function(){
    cleanup();
    if(failure) failure("Could not connect to Google Sheet.");
  };

  script.src = API_URL + "?" + query;
  document.body.appendChild(script);
}

function loadData(){
  statusText.textContent = "Loading sheet data...";

  callApi(
    {action:"list"},
    function(data){
      sheetRows = Array.isArray(data.rows) ? data.rows : [];
      statusText.textContent = sheetRows.length + " records loaded from Google Sheet.";
    },
    function(error){
      statusText.textContent = "ERROR: " + error;
    }
  );
}

function extractModel(productCode){
  const value = String(productCode || "").trim();
  if(!value) return "";

  const lastDash = value.lastIndexOf("-");
  return lastDash > 0 ? value.substring(0,lastDash).trim() : value;
}

function searchProduct(){
  const productCode = productInput.value.trim();

  if(!productCode){
    showNotFound("", "Please scan or enter a product code.");
    return;
  }

  const modelCode = extractModel(productCode).toLowerCase();

  const matches = sheetRows.filter(function(row){
    return String(row.model || "").trim().toLowerCase() === modelCode;
  });

  showSearchResult(extractModel(productCode), matches);
}

function showSearchResult(modelCode, matches){
  resultModel.textContent = modelCode;

  if(matches.length){
    resultBox.className = "result found show";
    resultTitle.textContent = "✓ PRODUCT FOUND";

    const racks = [];
    matches.forEach(function(row){
      const rack = String(row.rack || "").trim();
      if(rack && !racks.includes(rack)) racks.push(rack);
    });

    if(racks.length === 1){
      rackResult.className = "rack-code";
      rackResult.textContent = racks[0];
    }else if(racks.length > 1){
      rackResult.className = "rack-list";
      rackResult.innerHTML = racks.map(function(rack){
        return '<div class="rack-pill">' + escapeHtml(rack) + '</div>';
      }).join("");
    }else{
      rackResult.className = "not-found-text";
      rackResult.textContent = "No rack column recorded.";
    }
  }else{
    showNotFound(modelCode, "Rack column not found in the sheet.");
  }
}

function showNotFound(modelCode, message){
  resultBox.className = "result notfound show";
  resultTitle.textContent = "✕ NOT FOUND";
  resultModel.textContent = modelCode;
  rackResult.className = "not-found-text";
  rackResult.textContent = message;
}

function escapeHtml(value){
  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

/* CAMERA */

function openCamera(){
  if(cameraRunning || cameraOpening) return;

  if(typeof Html5Qrcode === "undefined"){
    alert("Camera scanner library did not load. Please refresh the page.");
    return;
  }

  cameraOverlay.classList.add("show");
  cameraOpening = true;

  setTimeout(startCamera, 150);
}

function startCamera(){
  if(!cameraOpening) return;

  qrScanner = new Html5Qrcode("reader");

  const config = {
    fps: 20,
    qrbox: function(width,height){
      const size = Math.floor(Math.min(width,height) * 0.72);
      return {width:size,height:size};
    },
    aspectRatio: 1.0,
    disableFlip: false
  };

  qrScanner.start(
    {facingMode:{exact:"environment"}},
    config,
    function(decodedText){
      handleCameraScan(decodedText);
    },
    function(){}
  ).then(function(){
    cameraOpening = false;
    cameraRunning = true;
    setTimeout(readCameraCapabilities, 300);
  }).catch(function(error){
    cameraOpening = false;
    cameraRunning = false;
    alert("Camera could not be opened.\n\n" + error);
  });
}

function handleCameraScan(decodedText){
  const now = Date.now();

  if(decodedText === lastCameraText && now - lastCameraTime < 1800) return;

  lastCameraText = decodedText;
  lastCameraTime = now;

  productInput.value = decodedText;
  closeCamera();
  searchProduct();
}

function readCameraCapabilities(){
  try{
    const video = document.querySelector("#reader video");

    if(video && video.srcObject){
      const tracks = video.srcObject.getVideoTracks();
      if(tracks.length) cameraTrack = tracks[0];
    }

    if(!cameraTrack || !cameraTrack.getCapabilities) return;

    const capabilities = cameraTrack.getCapabilities();

    if(capabilities.zoom){
      zoomMinimum = Number(capabilities.zoom.min);
      zoomMaximum = Number(capabilities.zoom.max);
      zoomStep = Number(capabilities.zoom.step || 0.1);

      zoomSlider.min = zoomMinimum;
      zoomSlider.max = zoomMaximum;
      zoomSlider.step = zoomStep;
      zoomSlider.value = zoomMinimum;
      zoomValue.textContent = zoomMinimum.toFixed(1) + "×";
    }else{
      zoomMinimum = zoomMaximum = 1;
      zoomSlider.min = 1;
      zoomSlider.max = 1;
      zoomSlider.value = 1;
      zoomValue.textContent = "Not supported";
    }

    if(capabilities.torch){
      flashButton.disabled = false;
      flashButton.textContent = "🔦 FLASH OFF";
    }else{
      flashButton.disabled = true;
      flashButton.textContent = "🔦 NOT SUPPORTED";
    }
  }catch(e){
    console.error("Camera capability error:",e);
  }
}

function applyZoom(value){
  const zoom = Number(value);

  zoomValue.textContent =
    zoomMaximum > zoomMinimum ? zoom.toFixed(1) + "×" : "Not supported";

  if(!cameraTrack || !cameraTrack.applyConstraints) return;

  try{
    cameraTrack.applyConstraints({advanced:[{zoom:zoom}]});
  }catch(e){}
}

function resetZoom(){
  if(zoomMaximum > zoomMinimum){
    zoomSlider.value = zoomMinimum;
    applyZoom(zoomMinimum);
  }
}

function toggleFlash(){
  if(!cameraTrack || !cameraTrack.getCapabilities) return;

  let capabilities = {};
  try{ capabilities = cameraTrack.getCapabilities(); }catch(e){}

  if(!capabilities.torch){
    alert("Flash is not supported by this camera/browser.");
    return;
  }

  const newState = !torchOn;

  cameraTrack.applyConstraints({
    advanced:[{torch:newState}]
  }).then(function(){
    torchOn = newState;
    flashButton.textContent = torchOn ? "🔦 FLASH ON" : "🔦 FLASH OFF";
    flashButton.classList.toggle("on", torchOn);
  }).catch(function(){
    alert("Flash could not be changed on this phone/browser.");
  });
}

function stopCamera(){
  if(!qrScanner || !cameraRunning) return Promise.resolve();

  return qrScanner.stop()
    .then(function(){cameraRunning=false;})
    .catch(function(){cameraRunning=false;});
}

function closeCamera(){
  stopCamera().finally(function(){
    cameraOpening = false;
    cameraTrack = null;
    torchOn = false;

    cameraOverlay.classList.remove("show");

    flashButton.disabled = false;
    flashButton.textContent = "🔦 FLASH OFF";
    flashButton.classList.remove("on");

    zoomSlider.value = 1;
    zoomValue.textContent = "1.0×";
  });
}
</script>
</body>
</html>
